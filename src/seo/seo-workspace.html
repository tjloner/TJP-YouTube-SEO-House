<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TJP YouTube SEO Studio | Rank Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand: #fd5d5d;
      --brand-hover: #e04848;
      --brand-glow: rgba(253, 93, 93, 0.22);
      --bg-dark: #0a0d14;
      --panel-bg: #121824;
      --panel-border: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-yellow: #f59e0b;
      --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Header */
    header {
      background: rgba(18, 24, 36, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--panel-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }

    .brand-pill {
      background: var(--brand);
      color: #fff;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .status-badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    /* Workspace 2-Column Grid */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 430px 1fr;
      gap: 1.5rem;
      padding: 1.5rem 2rem;
      max-width: 1700px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 1024px) {
      main { grid-template-columns: 1fr; }
    }

    /* Panels */
    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .panel-header {
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 0.75rem;
    }

    .panel-header h2 {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .panel-header p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    /* Input Forms */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      background: #090d16;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.7rem 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-glow);
    }

    textarea {
      resize: vertical;
      min-height: 95px;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .btn-primary {
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.85rem 1.2rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
      box-shadow: 0 4px 18px var(--brand-glow);
    }

    .btn-primary:hover {
      background: var(--brand-hover);
      transform: translateY(-1px);
    }

    /* Results Dashboard (Right Column) */
    .dashboard-grid {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card {
      background: #0d121c;
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 1.2rem;
    }

    .card-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.9rem;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .copy-btn {
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 0.25rem 0.6rem;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }

    .copy-btn:hover {
      border-color: var(--brand);
      color: #fff;
    }

    /* Titles Section */
    .title-item {
      background: #141c2a;
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      margin-bottom: 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .title-item .title-text {
      font-size: 0.92rem;
      font-weight: 600;
      color: #fff;
    }

    .title-badges {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .tier-badge {
      font-size: 0.7rem;
      background: #1e293b;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      color: var(--text-muted);
    }

    .score-badge {
      font-size: 0.7rem;
      font-family: var(--font-mono);
      font-weight: 700;
      background: rgba(253, 93, 93, 0.15);
      color: var(--brand);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    /* Content Gaps / Tags Cloud */
    .pill-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .pill {
      font-size: 0.78rem;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      background: #162030;
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
    }

    .pill.gap-critical {
      border-color: rgba(253, 93, 93, 0.5);
      color: #fda4af;
      background: rgba(253, 93, 93, 0.1);
    }

    /* Tags Textbox Box */
    .tag-box {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      background: #090d16;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 0.75rem;
      color: #94a3b8;
      max-height: 90px;
      overflow-y: auto;
      word-break: break-all;
    }

    .char-counter {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Description Preview */
    pre.desc-preview {
      background: #090d16;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 1rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      max-height: 220px;
      overflow-y: auto;
      line-height: 1.5;
    }

    /* Strategy Brief Box */
    .brief-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    @media (max-width: 768px) {
      .brief-grid { grid-template-columns: 1fr; }
    }

    .brief-item {
      background: #141c2a;
      border-radius: 8px;
      padding: 0.8rem;
      font-size: 0.8rem;
      line-height: 1.4;
    }

    .brief-item strong {
      display: block;
      color: var(--brand);
      font-size: 0.75rem;
      margin-bottom: 0.3rem;
      text-transform: uppercase;
    }

    /* Placeholder state */
    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header>
    <div class="brand-logo">
      <span class="brand-pill">TJP</span>
      <span>YouTube SEO Engine</span>
    </div>
    <div class="status-badge" id="engineStatus">● Client-Side Engine Ready</div>
  </header>

  <!-- Workspace 2-Column Body -->
  <main>
    <!-- Left Column: Input Settings -->
    <section class="panel">
      <div class="panel-header">
        <h2>Input Engine Parameters</h2>
        <p>Set target keyword & competitor benchmarks to find vacuums.</p>
      </div>

      <div class="field-group">
        <label for="targetKeyword">Target Keyword / Topic *</label>
        <input type="text" id="targetKeyword" placeholder="e.g. youtube automation" value="youtube automation" />
      </div>

      <div class="field-group">
        <label for="languageSelect">Vernacular / Language Focus</label>
        <select id="languageSelect">
          <option value="en">English (Global)</option>
          <option value="hinglish" selected>Hinglish / Vernacular Phonetic</option>
          <option value="hi">Hindi (Native)</option>
          <option value="es">Spanish</option>
        </select>
      </div>

      <div class="field-group">
        <label for="durationInput">Target Duration (Minutes)</label>
        <input type="number" id="durationInput" min="2" max="180" value="12" />
      </div>

      <div class="field-group">
        <label for="competitorSnippets">Competitor Titles / Snippets (One per line)</label>
        <textarea id="competitorSnippets" placeholder="Paste 2-5 top performing competitor titles...">How to start YouTube Automation in 2026
YouTube Automation Exposed: The Brutal Truth
Complete YouTube Automation Guide For Beginners</textarea>
      </div>

      <button class="btn-primary" id="btnAnalyze">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        Generate SEO Strategy
      </button>
    </section>

    <!-- Right Column: Live Output Dashboard -->
    <section class="panel" id="dashboardPanel">
      <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h2>Strategy Dashboard</h2>
          <p>Signal-based output: Content gaps, titles & tag distribution.</p>
        </div>
        <span id="execMetric" style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted);">0.0ms</span>
      </div>

      <div id="resultsContainer">
        <div class="empty-state">Click <strong>Generate SEO Strategy</strong> to process keyword intent and vacuums.</div>
      </div>
    </section>
  </main>

  <!-- Client-side Logic Script Module -->
  <script type="module">
    import { TjpSeoEngine } from './seo-engine.js';

    const btnAnalyze = document.getElementById('btnAnalyze');
    const resultsContainer = document.getElementById('resultsContainer');
    const execMetric = document.getElementById('execMetric');

    btnAnalyze.addEventListener('click', runEngine);

    function runEngine() {
      const keyword = document.getElementById('targetKeyword').value.trim();
      const language = document.getElementById('languageSelect').value;
      const duration = parseInt(document.getElementById('durationInput').value, 10) || 10;
      const competitorRaw = document.getElementById('competitorSnippets').value;
      const competitorTitles = competitorRaw.split('\n').map(s => s.trim()).filter(s => s.length > 0);

      const result = TjpSeoEngine.analyze({
        targetKeyword: keyword,
        language: language,
        videoDurationMinutes: duration,
        competitorTitles: competitorTitles
      });

      if (!result.success || !result.data) {
        resultsContainer.innerHTML = `<div style="color: #fda4af; padding: 2rem;"><strong>Error:</strong> ${result.error || 'Failed to process.'}</div>`;
        return;
      }

      execMetric.innerText = `${result.executionTimeMs}ms (Client-Side)`;
      renderOutput(result.data);
    }

    function renderOutput(data) {
      resultsContainer.innerHTML = `
        <div class="dashboard-grid">

          <!-- Growth Brief -->
          <div class="card">
            <div class="card-title-row">
              <span class="card-title">Tactical Growth Brief</span>
              <span class="status-badge">Intent: ${data.intent.toUpperCase()}</span>
            </div>
            <div class="brief-grid">
              <div class="brief-item">
                <strong>Thumbnail Focus</strong>
                ${data.strategyBrief.thumbnailVisualCue}
              </div>
              <div class="brief-item">
                <strong>Retention Hook</strong>
                ${data.strategyBrief.retentionHook}
              </div>
              <div class="brief-item">
                <strong>Pacing</strong>
                ${data.strategyBrief.recommendedPacing}
              </div>
            </div>
          </div>

          <!-- Titles Matrix -->
          <div class="card">
            <div class="card-title-row">
              <span class="card-title">5-Tier Psychological Titles</span>
            </div>
            <div id="titlesList">
              ${data.titles.map(t => `
                <div class="title-item">
                  <span class="title-text">${t.title}</span>
                  <div class="title-badges">
                    <span class="tier-badge">${t.tier}</span>
                    <span class="score-badge">Hook ${t.hookScore}</span>
                    <button class="copy-btn" onclick="navigator.clipboard.writeText('${t.title.replace(/'/g, "\\'")}')">Copy</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Content Gaps / Vacuums -->
          <div class="card">
            <div class="card-title-row">
              <span class="card-title">Detected Competitor Content Vacuums</span>
            </div>
            <div class="pill-cloud">
              ${data.contentGaps.length > 0
                ? data.contentGaps.map(g => `<span class="pill ${g.gapSeverity === 'critical' ? 'gap-critical' : ''}">+ ${g.keyword} (${g.frequencyInCompetitors}x)</span>`).join('')
                : '<span style="font-size:0.8rem; color: var(--text-muted);">No major content vacuums detected in provided competitor set.</span>'
              }
            </div>
          </div>

          <!-- Tag Cloud Allocation -->
          <div class="card">
            <div class="card-title-row">
              <span class="card-title">Compliant Tags (< 500 Chars)</span>
              <div style="display:flex; align-items:center; gap:0.5rem;">
                <span class="char-counter">${data.tags.charCount}/500 chars</span>
                <button class="copy-btn" id="copyTagsBtn">Copy All</button>
              </div>
            </div>
            <div class="tag-box" id="tagCloudBox">${data.tags.combinedTagString}</div>
          </div>

          <!-- Description Template -->
          <div class="card">
            <div class="card-title-row">
              <span class="card-title">Structured Description & Chapters</span>
              <button class="copy-btn" id="copyDescBtn">Copy Description</button>
            </div>
            <pre class="desc-preview" id="descContent">${data.description.formattedDescription}</pre>
          </div>

        </div>
      `;

      // Copy Handlers
      document.getElementById('copyTagsBtn')?.addEventListener('click', () => {
        navigator.clipboard.writeText(data.tags.combinedTagString);
        alert('Tags copied to clipboard!');
      });

      document.getElementById('copyDescBtn')?.addEventListener('click', () => {
        navigator.clipboard.writeText(data.description.formattedDescription);
        alert('Description copied to clipboard!');
      });
    }

    // Run automatically on first load with defaults
    runEngine();
  </script>
</body>
</html>
